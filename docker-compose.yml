services:
  postgres:
    image: postgres:15-alpine
    container_name: greeva_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: greeva
      POSTGRES_USER: greeva
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greeva -d greeva"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: greeva_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: greeva_meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  mailpit:
    image: axllent/mailpit:latest
    container_name: greeva_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # backend:
  #   build: ./backend
  #   (akan diaktifkan di Phase 0 Step 2)

  # nginx:
  #   image: nginx:alpine
  #   (akan diaktifkan saat backend siap)

volumes:
  postgres_data:
  meilisearch_data:
